<!DOCTYPE html>
<html>
<head>
  {% include head.html %}
{% if page.use_math %}
	{% include mathjax_support.html %}
{% endif %}
</head>
  <body>
    <main class="u-container "style="padding:0;margin:0;">
      <canvas id="sph-canvas" style="display:block;width:100%;height:320px;max-width:800px;margin:0 auto;border-radius:14px;background:#121e2a;"></canvas>
      {{ content }}
    </main>
    {% if jekyll.environment == 'production' %}
    {% include analytics.html %}
    {% endif %}
  </body>
</html>

<script>
const canvas = document.getElementById("sph-canvas");
const ctx = canvas.getContext("2d");

const PARTICLE_RADIUS = 5;
const H = 18;
const MASS = 1;
const REST_DENS = 10;
const GAS_CONST = 0.5;
const VISC = 0.1;
const GRAV = 0.18;

function getNumParticles() {
  return Math.min(180, Math.floor((canvas.width * canvas.height) / 3500));
}
let NUM_PARTICLES = 120;

function createParticles() {
  const arr = [];
  for (let i = 0; i < NUM_PARTICLES; i++) {
    arr.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      fx: 0, fy: 0, rho: 0, p: 0,
    });
  }
  return arr;
}

let particles = [];

function resizeCanvas() {
  // (핵심!) 보이는 영역과 캔버스 좌표계를 1:1로 맞춘다
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);

  NUM_PARTICLES = getNumParticles();
  particles = createParticles();
}
window.addEventListener("resize", resizeCanvas, { passive: true });
resizeCanvas();

function poly6(r, h) {
  if (r >= 0 && r <= h) {
    const k = 315 / (64 * Math.PI * Math.pow(h, 9));
    return k * Math.pow((h * h - r * r), 3);
  }
  return 0;
}
function spiky(r, h) {
  if (r > 0 && r <= h) {
    const k = -45 / (Math.PI * Math.pow(h, 6));
    return k * Math.pow(h - r, 2);
  }
  return 0;
}

let mouseForce = { x: 0, y: 0, r: 0, active: false, t: 0 };
canvas.addEventListener("mousedown", function (e) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  mouseForce.x = (e.clientX - rect.left) * dpr;
  mouseForce.y = (e.clientY - rect.top) * dpr;
  mouseForce.r = 40 * dpr;
  mouseForce.active = true;
  mouseForce.t = performance.now();
});

function stepSPH() {
  for (let i = 0; i < NUM_PARTICLES; i++) {
    let pi = particles[i];
    let rho = 0;
    for (let j = 0; j < NUM_PARTICLES; j++) {
      const pj = particles[j];
      const dx = pi.x - pj.x, dy = pi.y - pj.y;
      const r2 = dx * dx + dy * dy;
      if (r2 < H * H) rho += MASS * poly6(Math.sqrt(r2), H);
    }
    pi.rho = rho;
    pi.p = GAS_CONST * (rho - REST_DENS);
  }
  for (let i = 0; i < NUM_PARTICLES; i++) {
    let pi = particles[i], fx = 0, fy = 0;
    for (let j = 0; j < NUM_PARTICLES; j++) {
      if (i === j) continue;
      const pj = particles[j];
      const dx = pi.x - pj.x, dy = pi.y - pj.y;
      const r2 = dx * dx + dy * dy;
      if (r2 < 1e-6 || r2 >= H * H) continue;
      const r = Math.sqrt(r2);

      const fPress = -MASS * (pi.p + pj.p) / (2 * pj.rho) * spiky(r, H);
      fx += fPress * dx / r;
      fy += fPress * dy / r;
      const fVisc = VISC * MASS * (pj.vx - pi.vx) / pj.rho * poly6(r, H);
      fx += fVisc;
      fy += VISC * MASS * (pj.vy - pi.vy) / pj.rho * poly6(r, H);
    }
    fy += GRAV;
    pi.fx = fx; pi.fy = fy;
  }
  if (mouseForce.active) {
    const now = performance.now();
    if (now - mouseForce.t < 300) {
      for (let i = 0; i < NUM_PARTICLES; i++) {
        let p = particles[i];
        const dx = p.x - mouseForce.x;
        const dy = p.y - mouseForce.y;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < mouseForce.r * mouseForce.r) {
          const dist = Math.sqrt(dist2) + 0.01;
          const strength = 0.13 * (1 - dist / mouseForce.r);
          p.vx += dx / dist * strength;
          p.vy += dy / dist * strength;
        }
      }
    } else {
      mouseForce.active = false;
    }
  }
  for (let i = 0; i < NUM_PARTICLES; i++) {
    let p = particles[i];
    p.vx += p.fx;
    p.vy += p.fy;
    p.x += p.vx;
    p.y += p.vy;
    // 경계 처리(최종! 바닥, 천장, 좌우 정확히 캔버스 영역으로)
    if (p.x < PARTICLE_RADIUS) { p.x = PARTICLE_RADIUS; p.vx *= -0.6; }
    if (p.x > canvas.width - PARTICLE_RADIUS) { p.x = canvas.width - PARTICLE_RADIUS; p.vx *= -0.6; }
    if (p.y < PARTICLE_RADIUS) { p.y = PARTICLE_RADIUS; p.vy *= -0.6; }
    if (p.y > canvas.height - PARTICLE_RADIUS) {
      p.y = canvas.height - PARTICLE_RADIUS;
      p.vy *= -0.6;
    }
  }
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 바닥선 그리기
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, canvas.height - PARTICLE_RADIUS);
  ctx.lineTo(canvas.width, canvas.height - PARTICLE_RADIUS);
  ctx.strokeStyle = "rgba(200,200,200,0.18)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
  // 파티클
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const p = particles[i];
    const fmag = Math.sqrt(p.fx * p.fx + p.fy * p.fy);
    const norm = Math.min(fmag / 38, 1.0);
    const hue = 220 - 220 * norm;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PARTICLE_RADIUS, 0, 2 * Math.PI);
    ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
    ctx.fill();
  }
  if (mouseForce.active) {
    const now = performance.now();
    if (now - mouseForce.t < 300) {
      const alpha = 1 - (now - mouseForce.t) / 300;
      ctx.beginPath();
      ctx.arc(mouseForce.x, mouseForce.y, mouseForce.r, 0, 2 * Math.PI);
      ctx.strokeStyle = `rgba(255,80,60,${0.25 * alpha})`;
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }
}

function animate() {
  stepSPH();
  drawParticles();
  requestAnimationFrame(animate);
}
animate();

</script>
