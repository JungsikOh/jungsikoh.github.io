<!DOCTYPE html>
<html>
<head>
  {% include head.html %}
{% if page.use_math %}
	{% include mathjax_support.html %}
{% endif %}
</head>
  <body>
    <main class="u-container">
      <canvas id="sph-canvas" style="display:block;width:100%;height:320px;max-width:800px;margin:0 auto;border-radius:14px;background:#121e2a;"></canvas>
      {{ content }}
    </main>
    {% if jekyll.environment == 'production' %}
    {% include analytics.html %}
    {% endif %}
  </body>
</html>

<script>
/* ===== SPH Particle Simulation (CSS-space) ===== */
const canvas = document.getElementById("sph-canvas");
const ctx     = canvas.getContext("2d");

/* --- 시뮬레이션/그래픽 공용 파라미터 (CSS 단위) --- */
const R   = 5;        // 파티클 반지름
const H   = 18;
const M   = 1;
const ρ0  = 10;
const K   = .5;
const μ   = .1;
const g   = .18;

let simW = 0, simH = 0, dpr = 1;
let NUM  = 120;
let particles = [];

/* DPI-aware 캔버스 리사이즈 & 좌표계 동기화 */
function resizeCanvas() {
  dpr   = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  simW  = rect.width;
  simH  = rect.height;

  canvas.width  = simW * dpr;   // 내부 버퍼
  canvas.height = simH * dpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);          // 이후 모든 좌표는 CSS px

  NUM = Math.min(180, Math.floor((simW*simH)/3500));
  particles = Array.from({length:NUM}, () => ({
      x: Math.random()*simW,
      y: Math.random()*simH,
      vx: (Math.random()-.5)*2,
      vy: (Math.random()-.5)*2,
      fx:0, fy:0, rho:0, p:0
  }));
}
window.addEventListener("resize", resizeCanvas, {passive:true});
resizeCanvas();

/* SPH 커널 */
const poly6 = (r,h)=>(r>=0&&r<=h)?315/(64*Math.PI*h**9)*(h*h-r*r)**3:0;
const spiky = (r,h)=>(r>0&&r<=h)?-45/(Math.PI*h**6)*(h-r)**2:0;

/* 마우스 충격파 */
const mouse = {x:0,y:0,r:40,act:false,t:0};
canvas.addEventListener("mousedown",e=>{
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  mouse.r = 40;               // CSS 단위 반경
  mouse.act = true; mouse.t = performance.now();
});

/* 물리 스텝 */
function step() {
  /* 밀도·압력 */
  for (let i=0;i<NUM;i++){
    let pi = particles[i]; let rho=0;
    for (let j=0;j<NUM;j++){
      const pj = particles[j];
      const dx=pi.x-pj.x, dy=pi.y-pj.y, r2=dx*dx+dy*dy;
      if (r2 < H*H) rho += M*poly6(Math.sqrt(r2),H);
    }
    pi.rho=rho; pi.p=K*(rho-ρ0);
  }
  /* 힘 */
  for (let i=0;i<NUM;i++){
    let pi=particles[i], fx=0, fy=0;
    for (let j=0;j<NUM;j++){
      if(i===j) continue;
      const pj=particles[j];
      const dx=pi.x-pj.x, dy=pi.y-pj.y, r2=dx*dx+dy*dy;
      if(r2<1e-6||r2>=H*H) continue;
      const r=Math.sqrt(r2);
      fx += -M*(pi.p+pj.p)/(2*pj.rho)*spiky(r,H)*dx/r
          +  μ*M*(pj.vx-pi.vx)/pj.rho*poly6(r,H);
      fy += -M*(pi.p+pj.p)/(2*pj.rho)*spiky(r,H)*dy/r
          +  μ*M*(pj.vy-pi.vy)/pj.rho*poly6(r,H);
    }
    fy += g;
    pi.fx=fx; pi.fy=fy;
  }
  /* 마우스 충격 */
  if(mouse.act){
    const now=performance.now();
    if(now-mouse.t<300){
      for(let p of particles){
        const dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
        if(d2<mouse.r*mouse.r){
          const d=Math.sqrt(d2)+.01, s=.13*(1-d/mouse.r);
          p.vx+=dx/d*s; p.vy+=dy/d*s;
        }
      }
    }else mouse.act=false;
  }
  /* 적분 & 경계 */
  for(let p of particles){
    p.vx+=p.fx; p.vy+=p.fy;
    p.x +=p.vx; p.y +=p.vy;
    if(p.x<R){p.x=R;p.vx*=-.6;}
    if(p.x>simW-R){p.x=simW-R;p.vx*=-.6;}
    if(p.y<R){p.y=R;p.vy*=-.6;}
    if(p.y>simH-R){p.y=simH-R;p.vy*=-.6;}
  }
}

/* 렌더 */
function draw(){
  ctx.clearRect(0,0,simW,simH);
  /* 바닥선 */
  ctx.beginPath();
  ctx.moveTo(0,simH-R);
  ctx.lineTo(simW,simH-R);
  ctx.strokeStyle="rgba(200,200,200,.18)";
  ctx.lineWidth=2;
  ctx.stroke();

  for(let p of particles){
    const f=Math.hypot(p.fx,p.fy), n=Math.min(f/38,1);
    const hue=220-220*n;
    ctx.beginPath();
    ctx.arc(p.x,p.y,R,0,Math.PI*2);
    ctx.fillStyle=`hsl(${hue},80%,60%)`;
    ctx.fill();
  }
  /* 이펙트 링 */
  if(mouse.act){
    const alpha=1-(performance.now()-mouse.t)/300;
    ctx.beginPath();
    ctx.arc(mouse.x,mouse.y,mouse.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,80,60,${.25*alpha})`;
    ctx.lineWidth=4; ctx.stroke();
  }
}

/* 루프 */
(function loop(){
  step(); draw(); requestAnimationFrame(loop);
})();

</script>
