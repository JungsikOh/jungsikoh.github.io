<!DOCTYPE html>
<html>
<head>
  {% include head.html %}
  {% if page.use_math %}{% include mathjax_support.html %}{% endif %}

  <!-- 더블-탭·핀치 확대 전역 차단 -->
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <style>
    /* 페이지 전체 스크롤·선택·바운스 차단 */
    html,body{
      height:100%;margin:0;
      overflow:hidden;
      overscroll-behavior:none;
      -webkit-overflow-scrolling:auto;
      touch-action:none;
      user-select:none;-webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    /* ‘＋’ 버튼 – 모든 시스템 제스처 차단 */
    .add-btn{
      position:absolute;top:12px;right:12px;
      width:36px;height:36px;border:none;border-radius:50%;
      background:#ff6b6b;color:#fff;font-size:22px;line-height:36px;
      cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);
      transition:background .15s;
      touch-action:manipulation;          /* 더블탭 줌 방지 */
      -webkit-tap-highlight-color:transparent;
    }
    .add-btn:hover{background:#ff4a4a;}
  </style>
</head>

<body>
<main class="u-container" style="height:100%;">
  <div style="position:relative;max-width:800px;height:100%;margin:0 auto;">
    <canvas id="sph-canvas"
            style="display:block;width:100%;height:320px;border-radius:14px;
                   background:#121e2a;"></canvas>
    <button id="add-btn" class="add-btn" aria-label="add particle">＋</button>
  </div>
  {{ content }}
</main>
{% if jekyll.environment == 'production' %}{% include analytics.html %}{% endif %}

<script>
/* === Fast SPH (uniform grid, pointer-friendly) === */
const canvas=document.getElementById('sph-canvas'), ctx=canvas.getContext('2d');
/* 기본 파라미터 */
const R=5,H=15,H2=H*H,M=1,RHO0=10,K=1,MU=.0005,G=.18,DAMP=.985,REST=.5;
const MAX_PARTICLES=1000;
/* 상태 */
let particles=[],simW=0,simH=0,dpr=1,NUM=0;
/* 커널 계수 */
const POLY6=315/(64*Math.PI*H**9),SPIKY=-45/(Math.PI*H**6);
/* 그리드 */
const CELL=H,INV_CELL=1/CELL;let grid={};const key=(x,y)=>x+','+y;
/* 리사이즈 */
function resize(){
  dpr=window.devicePixelRatio||1;
  const r=canvas.getBoundingClientRect();
  simW=r.width;simH=r.height;
  canvas.width=simW*dpr;canvas.height=simH*dpr;
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
  NUM=Math.min(500,(simW*simH/3500)|0);
  particles=Array.from({length:NUM},()=>spawn(Math.random()*simW,Math.random()*simH));
}
window.addEventListener('resize',resize,{passive:true});resize();
/* 스폰 */
const spawn=(x,y)=>({x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,fx:0,fy:0,rho:0,p:0,speed:0});
function addParticle(x,y){
  const remain=MAX_PARTICLES-particles.length;if(remain<=0)return;
  const n=Math.min(50,remain);
  for(let i=0;i<n;i++){
    const jx=(Math.random()-.5)*24,jy=(Math.random()-.5)*24;
    particles.push(spawn(x+jx,y+jy));
  }
  NUM=particles.length;
}
/* 포인터(마우스+터치) */
const mouse={x:0,y:0,r:130,hold:false};
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  canvas.setPointerCapture(e.pointerId);
  mouse.hold=true;updatePos(e); e.preventDefault();
},{passive:false});
canvas.addEventListener('pointermove',e=>{if(mouse.hold)updatePos(e);});
canvas.addEventListener('pointerup',e=>{mouse.hold=false;canvas.releasePointerCapture(e.pointerId);});
canvas.addEventListener('pointercancel',()=>{mouse.hold=false;});
function updatePos(e){
  const r=canvas.getBoundingClientRect();
  mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
}
/* ‘＋’ 버튼 – 포인터다운으로 즉시 반응 (연속 탭 가능) */
const btn=document.getElementById('add-btn');
btn.addEventListener('pointerdown',e=>{
  addParticle(Math.random()*simW,Math.random()*simH*.4);
  e.preventDefault();      /* 확대·선택 차단 */
},{passive:false});
/* 길게 눌러도 메뉴/텍스트 선택 차단 */
['contextmenu','touchstart'].forEach(ev=>btn.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
/* 시뮬레이션 스텝 */
function step(){
  grid=Object.create(null);
  for(let i=0;i<NUM;i++){
    const p=particles[i],cx=(p.x*INV_CELL)|0,cy=(p.y*INV_CELL)|0;
    (grid[key(cx,cy)]??=[]).push(i);p.rho=p.p=0;
  }
  for(let i=0;i<NUM;i++){
    const p=particles[i],cx=(p.x*INV_CELL)|0,cy=(p.y*INV_CELL)|0;
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
      const cell=grid[key(cx+ox,cy+oy)];if(!cell)continue;
      for(const j of cell){
        const q=particles[j],dx=p.x-q.x,dy=p.y-q.y,r2=dx*dx+dy*dy;
        if(r2<H2)p.rho+=M*POLY6*(H2-r2)**3;
      }
    }
    p.p=K*(p.rho-RHO0);
  }
  for(let i=0;i<NUM;i++){
    const p=particles[i];let fx=0,fy=0,cx=(p.x*INV_CELL)|0,cy=(p.y*INV_CELL)|0;
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
      const cell=grid[key(cx+ox,cy+oy)];if(!cell)continue;
      for(const j of cell){
        if(i===j)continue;
        const q=particles[j],dx=p.x-q.x,dy=p.y-q.y,r2=dx*dx+dy*dy;
        if(r2>=H2||r2<1e-6)continue;
        const r=Math.sqrt(r2),invR=1/r,hmr=H-r;
        const press=-M*(p.p+q.p)/(2*q.rho)*SPIKY*hmr*hmr;
        const visc=MU*M*POLY6*(H2-r2)**3/q.rho;
        fx+=press*dx*invR+visc*(q.vx-p.vx);
        fy+=press*dy*invR+visc*(q.vy-p.vy);
      }
    }
    fy+=G;p.fx=fx;p.fy=fy;
  }
  if(mouse.hold){
    const rSq=mouse.r*mouse.r;
    for(const p of particles){
      const dx=mouse.x-p.x,dy=mouse.y-p.y,d2=dx*dx+dy*dy;
      if(d2<rSq){
        const invD=1/(Math.sqrt(d2)+.01),s=.5*(1-Math.sqrt(d2)/mouse.r);
        p.vx+=dx*invD*s;p.vy+=dy*invD*s;
      }
    }
  }
  for(const p of particles){
    // p.vx+=p.fx;p.vy+=p.fy;
    p.vx*=DAMP;p.vy*=DAMP;
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<R){p.x=R;p.vx*=-REST;}
    if(p.x>simW-R){p.x=simW-R;p.vx*=-REST;}
    if(p.y<R){p.y=R;p.vy*=-REST;}
    if(p.y>simH-R){p.y=simH-R;p.vy*=-REST;}
    p.speed=Math.hypot(p.vx,p.vy);
  }
  for(const k in grid){
    const cell=grid[k];
    for(let a=0;a<cell.length;a++)for(let b=a+1;b<cell.length;b++){
      const p=particles[cell[a]],q=particles[cell[b]],dx=p.x-q.x,dy=p.y-q.y,dist=Math.hypot(dx,dy);
      if(dist>0&&dist<2*R){
        const o=(2*R-dist)*.5,nx=dx/dist,ny=dy/dist;
        p.x+=nx*o;p.y+=ny*o;q.x-=nx*o;q.y-=ny*o;
        const vn=(p.vx-q.vx)*nx+(p.vy-q.vy)*ny;
        if(vn<0){
          const j=-(1+REST)*vn*.5;
          p.vx+=j*nx;p.vy+=j*ny;q.vx-=j*nx;q.vy-=j*ny;
        }
      }
    }
  }
}
/* 렌더 */
function draw(){
  ctx.clearRect(0,0,simW,simH);
  let maxV=0;for(const p of particles)if(p.speed>maxV)maxV=p.speed;
  maxV=Math.max(maxV,1);
  for(const p of particles){
    const hue=220-220*Math.min(p.speed/maxV,1);
    ctx.fillStyle=`hsl(${hue},80%,60%)`;
    ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill();
  }
  if(mouse.hold){
    ctx.beginPath();ctx.arc(mouse.x,mouse.y,mouse.r/2,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.stroke();
  }
}
/* 루프 */
(function loop(){step();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
